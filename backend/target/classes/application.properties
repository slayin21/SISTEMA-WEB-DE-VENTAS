# Configuración del Servidor Spring Boot
server.port=8080
server.servlet.context-path=/api/v1

# Configuración de Base de Datos - Microsoft SQL Server (SQLEXPRESS / ZapateriaJoselito)
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=ZapateriaJoselito;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Zapateria@2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configuración de JPA / Hibernate (none para no intentar alterar tablas ya creadas en SQL Server)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.default_schema=dbo

# Evitar errores de serialización Jackson en beans vacíos
spring.jackson.serialization.fail-on-empty-beans=false
